# 发布：构建安装包并发布到 GitHub Release（仓库首页右侧 Releases 可见）。
# 触发方式：
# - 推送 v* 标签（如 git tag v0.2.0 && git push origin v0.2.0）
# - Actions → Release → Run workflow，填写版本号（如 0.2.0），自动在当前提交上打 v0.2.0 标签
# 版本号带 “-”（如 0.2.0-beta.1）时发布为预发布版本。
#
# 目前只构建 macOS（Apple 芯片 arm64）。其他平台在 build 的 matrix 中添加，
# 并在 packages/desktop/electron-builder.json 中配置对应 target。
# 自动更新（electron-updater）读取 Release 中的 latest-mac.yml；以后加 Intel Mac 时须在同一次 electron-builder
# 运行中同时打 x64 与 arm64，生成包含两种架构的一份 latest-mac.yml（分开构建会互相覆盖）。
#
# 代码签名可选，未配置时产出 ad-hoc 签名的安装包（见 packages/desktop/scripts/adhoc-sign.mjs）：
# - macOS 签名：CSC_LINK（.p12 的 base64 或下载地址）、CSC_KEY_PASSWORD
# - macOS 公证：APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，如 0.2.0；带 - 为预发布，如 0.2.0-beta.1）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  # 安装依赖时不需要 Electron 二进制；electron-builder 打包时按目标平台自行下载
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # 性能断言的预算按开发机设定；GitHub 运行器约慢 10 倍且多个包并行测试，统一放宽（见 packages/test-support）
  PERF_BUDGET_SCALE: '10'

jobs:
  version:
    name: 确定版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::版本号无效：${version}（应为 1.2.3 或 1.2.3-beta.1）"
            exit 1
          fi
          tag="v${version}"
          # 手动触发时标签必须是新的，避免覆盖已发布的版本
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            echo "::error::标签 ${tag} 已存在，请换一个版本号"
            exit 1
          fi
          prerelease=false
          if [[ "${version}" == *-* ]]; then prerelease=true; fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  verify:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建子包
        run: pnpm build:libs
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元测试
        run: pnpm test

  build:
    name: 构建 ${{ matrix.name }}
    needs: [version, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest 为 Apple 芯片运行器
          - name: macOS-arm64
            os: macos-latest
            target: --mac --arm64
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建子包
        run: pnpm build:libs

      - name: 构建应用
        run: pnpm build:desktop

      - name: 准备应用目录
        working-directory: packages/desktop
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/stage-app.mjs

      - name: 打包安装包
        working-directory: packages/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 没有证书时不去钥匙串里自动查找，由 afterPack 钩子做 ad-hoc 签名
          if [ -z "${CSC_LINK}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "${APPLE_ID}" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npx electron-builder ${{ matrix.target }} --publish never

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest-mac.yml

  release:
    name: 发布到 GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: 生成校验和与说明
        working-directory: installers
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # 缺少更新信息时已安装的应用收不到这个版本
          test -f latest-mac.yml || { echo "::error::缺少 latest-mac.yml"; exit 1; }
          sha256sum * > SHA256SUMS.txt
          cat > ../release-notes.md <<EOF
          ## 下载

          | 平台 | 安装包 |
          | --- | --- |
          | macOS（Apple 芯片 M1 / M2 / M3 / M4） | \`Code-Reader-${VERSION}-mac-arm64.dmg\`（或免安装的 \`.zip\`） |

          暂未提供 Intel Mac、Windows、Linux 安装包。\`SHA256SUMS.txt\` 为各文件的校验和；
          \`latest-mac.yml\` 与 \`.blockmap\` 供应用内的自动更新使用，不需要下载。

          安装包未经 Apple 公证，第一次打开会被拦截：在“应用程序”中右键应用 → **打开**；
          仍被拦截时到 **系统设置 → 隐私与安全性**，点“仍要打开”。
          应用启动后会检查新版本（也可以点菜单 **帮助 → 检查更新…**）；未签名的安装包无法在应用内自动安装，
          会提示前往本页下载新版。
          EOF

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Code Reader ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          generate_release_notes: true
          files: installers/*
