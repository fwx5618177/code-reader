<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e9d5ff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGradient)"/>

  <!-- Inner shadow effect -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Code brackets: </> -->
  <g fill="none" stroke="url(#codeGradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket < -->
    <polyline points="200,160 120,256 200,352"/>

    <!-- Right bracket > -->
    <polyline points="312,160 392,256 312,352"/>

    <!-- Slash / -->
    <line x1="280" y1="140" x2="232" y2="372"/>
  </g>

  <!-- Subtle highlight on top -->
  <ellipse cx="256" cy="100" rx="160" ry="40" fill="rgba(255,255,255,0.1)"/>
</svg>
